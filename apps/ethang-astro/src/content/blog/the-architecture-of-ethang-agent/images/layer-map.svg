<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="layers-title layers-desc" font-family="Inter, sans-serif">
  <title id="layers-title">The eThang Agent layer map: the desktop frontend at the top, the composition root below it, nine bounded contexts in the middle band, and ten anti-corruption layers at the bottom edge touching the outside world</title>
  <desc id="layers-desc">Four horizontal bands. The top band is the Avalonia desktop frontend. Below it sits the composition root, which wires every implementation against every interface. The middle band holds nine bounded context projects: Agent, Tool, Conversation, Model, Capability, Skill, State, Memory, and Plan, plus a shared kernel of base types. The bottom band holds ten anti-corruption layer projects, each implementing domain-owned interfaces: OpenRouter, Roslyn, FileSystem, Storage, Transport, Web, Documents, PDF, ComputerUse, and MCP. Arrows point downward only: the frontend depends on the composition root, the composition root depends on everything, domains depend on interfaces, and the ACLs depend on the domains. Nothing external reaches upward into a domain.</desc>
  <defs>
    <linearGradient id="lm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <marker id="lm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#lm-bg)"/>

  <!-- Band 1: frontend -->
  <rect x="60" y="48" width="1080" height="64" rx="12" fill="#16233c" stroke="#e879f9" stroke-width="2"/>
  <text x="84" y="76" fill="#f0abfc" font-size="14" font-weight="700" letter-spacing="2">FRONTEND</text>
  <text x="84" y="98" fill="#e6edf7" font-size="16">eThangAgent.Desktop — Avalonia UI, view models, streaming bridge</text>
  <text x="1132" y="86" fill="#6f809c" font-size="13" text-anchor="end">10.5K lines</text>

  <line x1="600" y1="112" x2="600" y2="140" stroke="#7dd3fc" stroke-width="2" marker-end="url(#lm-arrow)"/>
  <text x="616" y="132" fill="#bae6fd" font-size="13">supplies provider + workspace</text>

  <!-- Band 2: composition -->
  <rect x="60" y="144" width="1080" height="64" rx="12" fill="#1b2b47" stroke="#38bdf8" stroke-width="2"/>
  <text x="84" y="172" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="2">COMPOSITION ROOT</text>
  <text x="84" y="194" fill="#e6edf7" font-size="16">eThangAgent.Composition — every interface gets its implementation, in one place</text>
  <text x="1132" y="182" fill="#6f809c" font-size="13" text-anchor="end">4.8K lines</text>

  <line x1="600" y1="208" x2="600" y2="236" stroke="#7dd3fc" stroke-width="2" marker-end="url(#lm-arrow)"/>
  <text x="616" y="228" fill="#bae6fd" font-size="13">wires everything below</text>

  <!-- Band 3: domains -->
  <text x="60" y="262" fill="#5eead4" font-size="14" font-weight="700" letter-spacing="2">BOUNDED CONTEXTS — 9 DOMAINS + SHARED KERNEL</text>
  <g>
    <rect x="60" y="276" width="250" height="96" rx="10" fill="#16233c" stroke="#5eead4" stroke-width="2"/>
    <text x="80" y="304" fill="#e6edf7" font-size="16" font-weight="600">Agent Domain</text>
    <text x="80" y="328" fill="#9fb0cc" font-size="13">the loop, tool dispatch,</text>
    <text x="80" y="348" fill="#9fb0cc" font-size="13">spawn contracts, watchdog</text>

    <rect x="330" y="276" width="250" height="96" rx="10" fill="#16233c" stroke="#2b3d61"/>
    <text x="350" y="304" fill="#e6edf7" font-size="16" font-weight="600">Tool Domain</text>
    <text x="350" y="328" fill="#9fb0cc" font-size="13">32 tools + every seam</text>
    <text x="350" y="348" fill="#9fb0cc" font-size="13">interface the ACLs implement</text>

    <rect x="600" y="276" width="250" height="96" rx="10" fill="#16233c" stroke="#2b3d61"/>
    <text x="620" y="304" fill="#e6edf7" font-size="16" font-weight="600">Conversation</text>
    <text x="620" y="328" fill="#9fb0cc" font-size="13">the message aggregate,</text>
    <text x="620" y="348" fill="#9fb0cc" font-size="13">compaction invariants</text>

    <rect x="870" y="276" width="270" height="96" rx="10" fill="#16233c" stroke="#2b3d61"/>
    <text x="890" y="304" fill="#e6edf7" font-size="16" font-weight="600">Model</text>
    <text x="890" y="328" fill="#9fb0cc" font-size="13">IModelProvider seam,</text>
    <text x="890" y="348" fill="#9fb0cc" font-size="13">context accounting</text>
  </g>
  <g>
    <rect x="60" y="392" width="166" height="76" rx="10" fill="#16233c" stroke="#2b3d61"/>
    <text x="80" y="420" fill="#e6edf7" font-size="15" font-weight="600">Capability</text>
    <text x="80" y="442" fill="#9fb0cc" font-size="13">the merged registry</text>

    <rect x="246" y="392" width="136" height="76" rx="10" fill="#16233c" stroke="#2b3d61"/>
    <text x="266" y="420" fill="#e6edf7" font-size="15" font-weight="600">Skill</text>
    <text x="266" y="442" fill="#9fb0cc" font-size="13">three sources</text>

    <rect x="402" y="392" width="136" height="76" rx="10" fill="#16233c" stroke="#2b3d61"/>
    <text x="422" y="420" fill="#e6edf7" font-size="15" font-weight="600">State</text>
    <text x="422" y="442" fill="#9fb0cc" font-size="13">keys + evidence</text>

    <rect x="558" y="392" width="136" height="76" rx="10" fill="#16233c" stroke="#2b3d61"/>
    <text x="578" y="420" fill="#e6edf7" font-size="15" font-weight="600">Memory</text>
    <text x="578" y="442" fill="#9fb0cc" font-size="13">recall + curated</text>

    <rect x="714" y="392" width="136" height="76" rx="10" fill="#16233c" stroke="#2b3d61"/>
    <text x="734" y="420" fill="#e6edf7" font-size="15" font-weight="600">Plan</text>
    <text x="734" y="442" fill="#9fb0cc" font-size="13">structured plans</text>

    <rect x="870" y="392" width="270" height="76" rx="10" fill="#1b2b47" stroke="#2b3d61"/>
    <text x="890" y="420" fill="#e6edf7" font-size="15" font-weight="600">SharedKernel</text>
    <text x="890" y="442" fill="#9fb0cc" font-size="13">Result&lt;T&gt; · DomainError · Specification</text>
  </g>

  <line x1="600" y1="480" x2="600" y2="508" stroke="#7dd3fc" stroke-width="2" marker-end="url(#lm-arrow)"/>
  <text x="616" y="500" fill="#bae6fd" font-size="13">domains own the interfaces; ACLs implement them</text>

  <!-- Band 4: ACLs -->
  <text x="60" y="534" fill="#f7b267" font-size="14" font-weight="700" letter-spacing="2">ANTI-CORRUPTION LAYERS — 10 PROJECTS</text>
  <g font-size="14">
    <rect x="60" y="548" width="200" height="56" rx="10" fill="#1a2740" stroke="#f7b267"/>
    <text x="80" y="574" fill="#ffd9a0" font-weight="600">OpenRouter</text>
    <text x="80" y="594" fill="#c9a878" font-size="12.5">provider wire</text>

    <rect x="276" y="548" width="200" height="56" rx="10" fill="#1a2740" stroke="#f7b267"/>
    <text x="296" y="574" fill="#ffd9a0" font-weight="600">Roslyn</text>
    <text x="296" y="594" fill="#c9a878" font-size="12.5">exec scripting</text>

    <rect x="492" y="548" width="200" height="56" rx="10" fill="#1a2740" stroke="#f7b267"/>
    <text x="512" y="574" fill="#ffd9a0" font-weight="600">FileSystem</text>
    <text x="512" y="594" fill="#c9a878" font-size="12.5">files · git · shell</text>

    <rect x="708" y="548" width="200" height="56" rx="10" fill="#1a2740" stroke="#f7b267"/>
    <text x="728" y="574" fill="#ffd9a0" font-weight="600">Storage</text>
    <text x="728" y="594" fill="#c9a878" font-size="12.5">SQLite · 17 migrations</text>

    <rect x="924" y="548" width="216" height="56" rx="10" fill="#1a2740" stroke="#f7b267"/>
    <text x="944" y="574" fill="#ffd9a0" font-weight="600">Transport</text>
    <text x="944" y="594" fill="#c9a878" font-size="12.5">named pipes</text>

    <rect x="60" y="620" width="200" height="56" rx="10" fill="#1a2740" stroke="#f7b267"/>
    <text x="80" y="646" fill="#ffd9a0" font-weight="600">Web</text>
    <text x="80" y="666" fill="#c9a878" font-size="12.5">HTTP(S) fetch</text>

    <rect x="276" y="620" width="200" height="56" rx="10" fill="#1a2740" stroke="#f7b267"/>
    <text x="296" y="646" fill="#ffd9a0" font-weight="600">Documents</text>
    <text x="296" y="666" fill="#c9a878" font-size="12.5">docx / OOXML</text>

    <rect x="492" y="620" width="200" height="56" rx="10" fill="#1a2740" stroke="#f7b267"/>
    <text x="512" y="646" fill="#ffd9a0" font-weight="600">PDF</text>
    <text x="512" y="666" fill="#c9a878" font-size="12.5">pdf wire format</text>

    <rect x="708" y="620" width="200" height="56" rx="10" fill="#1a2740" stroke="#f7b267"/>
    <text x="728" y="646" fill="#ffd9a0" font-weight="600">ComputerUse</text>
    <text x="728" y="666" fill="#c9a878" font-size="12.5">UIA · input</text>

    <rect x="924" y="620" width="216" height="56" rx="10" fill="#1a2740" stroke="#f7b267"/>
    <text x="944" y="646" fill="#ffd9a0" font-weight="600">MCP</text>
    <text x="944" y="666" fill="#c9a878" font-size="12.5">Model Context Protocol</text>
  </g>

  <!-- outside world -->
  <line x1="60" y1="700" x2="1140" y2="700" stroke="#22314e" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="60" y="730" fill="#8fa0bd" font-size="14">Outside: OpenRouter's API, the file system, SQLite, Windows UIA, MCP servers, the shell.</text>
  <text x="1140" y="730" fill="#6f809c" font-size="13" text-anchor="end">only the ACLs touch it</text>
</svg>
