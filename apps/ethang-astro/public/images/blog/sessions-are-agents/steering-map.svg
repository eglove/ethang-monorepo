<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="steer-title steer-desc">
  <title id="steer-title">Steering a running child in the eThang Agent subagent system: mailbox delivery with urgency levels and preemption, subtree and ancestor broadcasts with per-hop receipts, and a consented link carrying a routed message outside the spawn tree</title>
  <desc id="steer-desc">A parent sends to a running child's bounded mailbox, which drains at safe points between loop iterations. Urgency levels from Normal to Urgent govern loudness, and a PreemptGrant lets an urgent message interrupt the child's turn. Notify-subtree broadcasts descend to leaves with per-hop receipts, escalate and notify-ancestors walk upward, and agent.route carries a message through a consented, revocable link to an agent outside the tree.</desc>
  <defs>
    <linearGradient id="steer-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111d35"/>
    </linearGradient>
    <marker id="steer-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="steer-arrow-back" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0abfc"/>
    </marker>
    <filter id="steer-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#steer-bg)"/>
  <text x="72" y="74" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="30" font-weight="700">Steering: mailboxes, broadcasts, links</text>
  <text x="72" y="108" fill="#94a3b8" font-family="Inter, sans-serif" font-size="17">Push, never poll — every delivery answers to its sender.</text>

  <g font-family="Inter, sans-serif">
    <text x="760" y="103" fill="#94a3b8" font-size="14">urgency:</text>
    <rect x="824" y="84" width="88" height="28" rx="14" fill="#0f1b2d" stroke="#64748b" stroke-width="1.5"/>
    <text x="868" y="103" fill="#cbd5e1" font-size="14" text-anchor="middle">Normal</text>
    <rect x="924" y="84" width="104" height="28" rx="14" fill="#0f1b2d" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="976" y="103" fill="#c7d2fe" font-size="14" text-anchor="middle">Attention</text>
    <rect x="1040" y="84" width="88" height="28" rx="14" fill="#0f1b2d" stroke="#fb7185" stroke-width="1.5"/>
    <text x="1084" y="103" fill="#fecdd3" font-size="14" text-anchor="middle">Urgent</text>
  </g>

  <g filter="url(#steer-shadow)">
    <rect x="80" y="240" width="250" height="130" rx="18" fill="#0f1b2d" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="80" y="240" width="250" height="9" rx="4" fill="#818cf8"/>
    <text x="108" y="282" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="14" font-weight="700">PARENT</text>
    <text x="108" y="310" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="700">Parent agent</text>
    <text x="108" y="340" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">continues its own turn</text>

    <rect x="460" y="230" width="300" height="150" rx="18" fill="#0f1b2d" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="460" y="230" width="300" height="9" rx="4" fill="#38bdf8"/>
    <text x="488" y="270" fill="#7dd3fc" font-family="Inter, sans-serif" font-size="14" font-weight="700">RUNNING CHILD</text>
    <text x="488" y="296" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="700">Child agent · running</text>
    <rect x="488" y="312" width="244" height="48" rx="10" fill="#0b1626" stroke="#334155" stroke-width="1.5"/>
    <text x="610" y="332" fill="#bae6fd" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" text-anchor="middle">bounded mailbox</text>
    <text x="610" y="350" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">drains at safe points — never mid-tool-call</text>

    <rect x="430" y="490" width="160" height="76" rx="14" fill="#0f1b2d" stroke="#f0abfc" stroke-width="1.5"/>
    <text x="510" y="522" fill="#f0abfc" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">LEAF</text>
    <text x="510" y="546" fill="#f8fafc" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">depth + 1</text>

    <rect x="620" y="490" width="160" height="76" rx="14" fill="#0f1b2d" stroke="#f0abfc" stroke-width="1.5"/>
    <text x="700" y="522" fill="#f0abfc" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">LEAF</text>
    <text x="700" y="546" fill="#f8fafc" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">depth + 1</text>

    <rect x="880" y="240" width="250" height="130" rx="18" fill="#0f1b2d" stroke="#f0abfc" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="880" y="240" width="250" height="9" rx="4" fill="#e879f9"/>
    <text x="908" y="282" fill="#f0abfc" font-family="Inter, sans-serif" font-size="14" font-weight="700">OUTSIDE THE TREE</text>
    <text x="908" y="310" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="700">Linked agent</text>
    <text x="908" y="340" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">consented · revocable · agent_links</text>
  </g>

  <path d="M330 272 L460 272" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#steer-arrow)"/>
  <text x="395" y="260" fill="#bae6fd" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">agent.send</text>
  <path d="M460 348 L330 348" fill="none" stroke="#f0abfc" stroke-width="3" marker-end="url(#steer-arrow-back)"/>
  <text x="395" y="392" fill="#f5d0fe" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">agent.escalate · notify-ancestors</text>

  <path d="M510 380 L510 490" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#steer-arrow)"/>
  <path d="M700 380 L700 490" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#steer-arrow)"/>
  <text x="610" y="446" fill="#bae6fd" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">notify-subtree · BFS down ParentId</text>
  <text x="770" y="600" fill="#bae6fd" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" text-anchor="end">hop=1 to=b7e delivered</text>
  <text x="1010" y="600" fill="#94a3b8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" text-anchor="end">reached=4 delivered=3</text>

  <path d="M760 300 L880 300" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#steer-arrow)"/>
  <text x="820" y="288" fill="#bae6fd" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">agent.route</text>
  <text x="1005" y="398" fill="#94a3b8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">via RemoteMailboxProxy</text>

  <text x="230" y="530" fill="#fecdd3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Urgent + PreemptGrant ⇒ interrupts the turn, then repair</text>
</svg>
