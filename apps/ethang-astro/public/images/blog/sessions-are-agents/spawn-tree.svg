<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="tree-title tree-desc">
  <title id="tree-title">The eThang Agent spawn tree: a root session at depth zero, children at depth one, and a grandchild at depth two, with the effective tool set narrowing at every level</title>
  <desc id="tree-desc">A root session holding read, write, exec, and web fetch tools spawns two children whose grants narrow the effective set. Child A may read and exec; child B may read and write. Child A spawns a grandchild that may only read. Depth is capped at three, and any spawn that tries to widen privilege fails.</desc>
  <defs>
    <linearGradient id="tree-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111d35"/>
    </linearGradient>
    <marker id="tree-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <filter id="tree-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#tree-bg)"/>
  <text x="72" y="74" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="30" font-weight="700">The spawn tree: every node is an agent record</text>
  <text x="72" y="108" fill="#94a3b8" font-family="Inter, sans-serif" font-size="17">One persisted shape from root to leaf — privilege may only narrow as depth grows.</text>

  <g filter="url(#tree-shadow)">
    <rect x="420" y="140" width="360" height="110" rx="18" fill="#0f1b2d" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="420" y="140" width="360" height="9" rx="4" fill="#38bdf8"/>
    <text x="448" y="182" fill="#7dd3fc" font-family="Inter, sans-serif" font-size="14" font-weight="700">AGENTRECORD · ROOT SESSION</text>
    <text x="448" y="210" fill="#f8fafc" font-family="Inter, sans-serif" font-size="21" font-weight="700">Root session · depth 0</text>
    <text x="448" y="236" fill="#cbd5e1" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14">read · write · exec · web_fetch</text>

    <rect x="150" y="330" width="340" height="110" rx="18" fill="#0f1b2d" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="150" y="330" width="340" height="9" rx="4" fill="#818cf8"/>
    <text x="178" y="372" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="14" font-weight="700">SPAWNED · CHILD A</text>
    <text x="178" y="400" fill="#f8fafc" font-family="Inter, sans-serif" font-size="21" font-weight="700">Child A · depth 1</text>
    <text x="178" y="426" fill="#cbd5e1" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14">read · exec   (allow: "read; exec")</text>

    <rect x="690" y="330" width="340" height="110" rx="18" fill="#0f1b2d" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="690" y="330" width="340" height="9" rx="4" fill="#818cf8"/>
    <text x="718" y="372" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="14" font-weight="700">SPAWNED · CHILD B</text>
    <text x="718" y="400" fill="#f8fafc" font-family="Inter, sans-serif" font-size="21" font-weight="700">Child B · depth 1</text>
    <text x="718" y="426" fill="#cbd5e1" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14">read · write   (deny: web_fetch)</text>

    <rect x="180" y="520" width="300" height="90" rx="18" fill="#0f1b2d" stroke="#f0abfc" stroke-width="2"/>
    <rect x="180" y="520" width="300" height="9" rx="4" fill="#e879f9"/>
    <text x="208" y="552" fill="#f0abfc" font-family="Inter, sans-serif" font-size="14" font-weight="700">SPAWNED · GRANDCHILD</text>
    <text x="208" y="578" fill="#f8fafc" font-family="Inter, sans-serif" font-size="19" font-weight="700">Grandchild · depth 2</text>
    <text x="208" y="600" fill="#cbd5e1" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14">read</text>

    <rect x="560" y="520" width="560" height="90" rx="18" fill="#0f1b2d" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="588" y="556" fill="#bae6fd" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14">MaxDepth = 3 → beyond it: Error [DepthExceeded]</text>
    <text x="588" y="586" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="14">Widening fails the spawn — privilege cannot grow down the tree.</text>
  </g>

  <path d="M480 250 L320 330" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#tree-arrow)"/>
  <path d="M720 250 L860 330" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#tree-arrow)"/>
  <path d="M320 440 L330 520" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#tree-arrow)"/>
  <text x="368" y="284" fill="#bae6fd" font-family="Inter, sans-serif" font-size="15">spawn</text>
  <text x="818" y="284" fill="#bae6fd" font-family="Inter, sans-serif" font-size="15">spawn</text>
  <text x="352" y="486" fill="#bae6fd" font-family="Inter, sans-serif" font-size="15">spawn</text>
</svg>
