<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="ladder-title ladder-desc">
  <title id="ladder-title">The watchdog ladder in eThang Agent: idle detection escalates from watching to an interrupt, a same-id retry with a wrap-up nudge, and a final Failed(Hung) verdict, with only three cancellation sources</title>
  <desc id="ladder-desc">Five steps across the diagram: watch while supervisor facts beat the idle clock; interrupt once the idle threshold crosses, after checking heartbeat presence; settle while observing the runtime for sixty seconds; retry the same id with a wrap-up nudge while preserving the partial transcript; and finally mark the child Failed(Hung) with an append-only watchdog events row. Below, a policy signature and the three cancellation sources: explicit interrupt, watchdog terminal decision, and budget hard ceiling.</desc>
  <defs>
    <linearGradient id="ladder-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111d35"/>
    </linearGradient>
    <linearGradient id="ladder-outcome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <marker id="ladder-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <filter id="ladder-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#ladder-bg)"/>
  <text x="72" y="74" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="30" font-weight="700">The watchdog ladder</text>
  <text x="72" y="108" fill="#94a3b8" font-family="Inter, sans-serif" font-size="17">No clocks — idle facts and budgets decide, and every step lands on the record.</text>

  <g filter="url(#ladder-shadow)">
    <rect x="64" y="170" width="185" height="180" rx="18" fill="#0f1b2d" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="100" cy="206" r="16" fill="#0b1626" stroke="#7dd3fc" stroke-width="2"/>
    <text x="100" y="211" fill="#7dd3fc" font-family="Inter, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1</text>
    <text x="84" y="262" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="700">Watch</text>
    <text x="84" y="290" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">supervisor beats</text>
    <text x="84" y="312" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">feed the idle clock</text>

    <rect x="282" y="170" width="185" height="180" rx="18" fill="#0f1b2d" stroke="#a5b4fc" stroke-width="2"/>
    <circle cx="318" cy="206" r="16" fill="#0b1626" stroke="#a5b4fc" stroke-width="2"/>
    <text x="318" y="211" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2</text>
    <text x="302" y="262" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="700">Interrupt</text>
    <text x="302" y="290" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">idle threshold crossed</text>
    <text x="302" y="312" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">presence gate checked</text>

    <rect x="500" y="170" width="185" height="180" rx="18" fill="#0f1b2d" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="536" cy="206" r="16" fill="#0b1626" stroke="#c4b5fd" stroke-width="2"/>
    <text x="536" y="211" fill="#c4b5fd" font-family="Inter, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3</text>
    <text x="520" y="262" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="700">Settle</text>
    <text x="520" y="290" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">observe settlement</text>
    <text x="520" y="312" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">60-second settle wait</text>

    <rect x="718" y="170" width="185" height="180" rx="18" fill="#0f1b2d" stroke="#f0abfc" stroke-width="2"/>
    <circle cx="754" cy="206" r="16" fill="#0b1626" stroke="#f0abfc" stroke-width="2"/>
    <text x="754" y="211" fill="#f0abfc" font-family="Inter, sans-serif" font-size="15" font-weight="700" text-anchor="middle">4</text>
    <text x="738" y="262" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="700">Retry</text>
    <text x="738" y="290" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">same-id retry with</text>
    <text x="738" y="312" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">a wrap-up nudge —</text>
    <text x="738" y="334" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">transcript preserved</text>

    <rect x="936" y="170" width="185" height="180" rx="18" fill="#0f1b2d" stroke="#fb7185" stroke-width="2"/>
    <circle cx="972" cy="206" r="16" fill="#0b1626" stroke="#fb7185" stroke-width="2"/>
    <text x="972" y="211" fill="#fb7185" font-family="Inter, sans-serif" font-size="15" font-weight="700" text-anchor="middle">5</text>
    <text x="956" y="262" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="700">Failed(Hung)</text>
    <text x="956" y="290" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">terminal verdict,</text>
    <text x="956" y="312" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">append-only</text>
    <text x="956" y="334" fill="#94a3b8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">watchdog_events</text>
  </g>

  <path d="M253 260 L278 260" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#ladder-arrow)"/>
  <path d="M471 260 L496 260" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#ladder-arrow)"/>
  <path d="M689 260 L714 260" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#ladder-arrow)"/>
  <path d="M907 260 L932 260" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#ladder-arrow)"/>

  <text x="600" y="404" fill="#7dd3fc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" text-anchor="middle">WatchdogPolicy.Decide(isChild, idleAge, wrapUpAttempts)</text>
  <text x="600" y="430" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">returns Watch, RetryWrapUp, or TerminalReport — defaults: 15-minute idle · 60-second settle · one wrap-up attempt</text>

  <rect x="64" y="470" width="1057" height="104" rx="20" fill="url(#ladder-outcome)" stroke="#38bdf8" stroke-width="2" filter="url(#ladder-shadow)"/>
  <text x="600" y="512" fill="#f8fafc" font-family="Inter, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Three cancellation sources, by design</text>
  <text x="600" y="544" fill="#bae6fd" font-family="Inter, sans-serif" font-size="15" text-anchor="middle">explicit interrupt · watchdog terminal decision · budget hard ceiling — wall-clock is never a cancellation source</text>
</svg>
