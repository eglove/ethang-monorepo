<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">Proof pipeline from business requirement to production feedback</title>
  <desc id="pipeline-desc">A sequence diagram showing a domain owner giving a requirement to a developer, who writes a failing test and gives a bounded task to an AI assistant. The change goes through tests, type checks, static analysis, a Sonar quality gate, domain review, continuous delivery, and production feedback. Failed evidence returns the work for correction.</desc>
  <defs>
    <linearGradient id="pipeline-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111d35"/>
    </linearGradient>
    <marker id="pipeline-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="pipeline-arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="pipeline-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#pipeline-bg)"/>
  <text x="62" y="66" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="29" font-weight="700">The proof pipeline</text>
  <text x="62" y="99" fill="#94a3b8" font-family="Inter, sans-serif" font-size="17">Every layer catches a different kind of wrong.</text>

  <g filter="url(#pipeline-shadow)">
    <rect x="52" y="136" width="180" height="68" rx="14" fill="#172554" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="272" y="136" width="180" height="68" rx="14" fill="#172554" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="492" y="136" width="180" height="68" rx="14" fill="#172554" stroke="#f0abfc" stroke-width="2"/>
    <rect x="712" y="136" width="216" height="68" rx="14" fill="#172554" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="868" y="268" width="280" height="68" rx="14" fill="#164e63" stroke="#38bdf8" stroke-width="2"/>
    <rect x="708" y="452" width="280" height="68" rx="14" fill="#164e63" stroke="#38bdf8" stroke-width="2"/>
    <rect x="372" y="584" width="280" height="68" rx="14" fill="#164e63" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <g fill="#f8fafc" font-family="Inter, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="142" y="164">Business requirement</text>
    <text x="362" y="164">Failing test</text>
    <text x="582" y="164">AI implementation</text>
    <text x="820" y="155">Tests + types +</text><text x="820" y="180">static analysis</text>
    <text x="1008" y="296">Sonar quality gate</text>
    <text x="848" y="480">Domain review</text>
    <text x="512" y="612">Production feedback</text>
  </g>

  <path d="M232 170 H262" stroke="#7dd3fc" stroke-width="3" marker-end="url(#pipeline-arrow)"/>
  <path d="M452 170 H482" stroke="#7dd3fc" stroke-width="3" marker-end="url(#pipeline-arrow)"/>
  <path d="M672 170 H702" stroke="#7dd3fc" stroke-width="3" marker-end="url(#pipeline-arrow)"/>
  <path d="M828 204 C828 232 928 236 978 258" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#pipeline-arrow)"/>
  <path d="M1008 336 C1008 390 928 420 878 442" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#pipeline-arrow)"/>
  <path d="M708 486 C660 520 620 546 590 574" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#pipeline-arrow)"/>

  <path d="M868 302 C730 250 580 250 582 204" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#pipeline-arrow-muted)"/>
  <text x="684" y="274" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="15" text-anchor="middle">failed check → revise</text>

  <rect x="64" y="290" width="650" height="204" rx="18" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <text x="94" y="327" fill="#7dd3fc" font-family="Inter, sans-serif" font-size="17" font-weight="700">What each layer knows</text>
  <text x="94" y="364" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="16">Tests</text><text x="220" y="364" fill="#94a3b8" font-family="Inter, sans-serif" font-size="16">Does selected behavior hold?</text>
  <text x="94" y="400" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="16">Static analysis</text><text x="220" y="400" fill="#94a3b8" font-family="Inter, sans-serif" font-size="16">Did the code introduce known risks?</text>
  <text x="94" y="436" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="16">Domain review</text><text x="220" y="436" fill="#94a3b8" font-family="Inter, sans-serif" font-size="16">Is this the behavior the business needs?</text>
  <text x="94" y="472" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="16">Production</text><text x="220" y="472" fill="#94a3b8" font-family="Inter, sans-serif" font-size="16">What assumption survived all earlier checks?</text>

  <text x="600" y="692" fill="#bae6fd" font-family="Inter, sans-serif" font-size="16" text-anchor="middle">AI supplies speed. The system supplies confidence.</text>
</svg>
