<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="pc-title pc-desc">
  <title id="pc-title">The eThang Agent compaction pressure cycle: utilization rises, the model is nudged once, the ceiling fires the compactor, and the clean lands at the target</title>
  <desc id="pc-desc">A utilization curve rises across turns, crosses the policy's soft level where a one-time reminder is appended, crosses the ceiling where the compactor runs, and drops to the target utilization before rising again. A side panel shows what one compaction replaces: a protected head that is never evicted, an evicted prefix summarized into a dense handoff, and a kept tail whose oversized tool results become relocation markers.</desc>
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111d35"/>
    </linearGradient>
    <marker id="pc-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <filter id="pc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#pc-bg)"/>
  <text x="72" y="74" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="30" font-weight="700">The pressure cycle: compaction keeps long runs alive</text>
  <text x="72" y="108" fill="#94a3b8" font-family="Inter, sans-serif" font-size="17">Utilization rises, the model is nudged once, the ceiling forces a clean, and the run continues at target.</text>

  <g font-family="Inter, sans-serif">
    <g stroke="#1e293b" stroke-width="1">
      <line x1="100" y1="180" x2="660" y2="180"/>
      <line x1="100" y1="270" x2="660" y2="270"/>
      <line x1="100" y1="360" x2="660" y2="360"/>
      <line x1="100" y1="450" x2="660" y2="450"/>
    </g>
    <g fill="#475569" font-size="13">
      <text x="88" y="545" text-anchor="end">0%</text>
      <text x="88" y="455" text-anchor="end">25%</text>
      <text x="88" y="365" text-anchor="end">50%</text>
      <text x="88" y="275" text-anchor="end">75%</text>
      <text x="88" y="185" text-anchor="end">100%</text>
    </g>
    <line x1="100" y1="180" x2="100" y2="540" stroke="#334155" stroke-width="2"/>
    <line x1="100" y1="540" x2="660" y2="540" stroke="#334155" stroke-width="2"/>
    <text x="100" y="168" fill="#64748b" font-size="13">context utilization</text>
    <text x="380" y="566" fill="#64748b" font-size="13" text-anchor="middle">turns</text>

    <line x1="100" y1="288" x2="660" y2="288" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.8"/>
    <text x="106" y="281" fill="#fbbf24" font-size="13">soft level — nudge once</text>
    <line x1="100" y1="252" x2="660" y2="252" stroke="#f87171" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.85"/>
    <text x="106" y="245" fill="#f87171" font-size="13">ceiling — compactor runs</text>
    <line x1="100" y1="396" x2="660" y2="396" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.7"/>

    <polyline points="110,504 165,468 220,414 275,352 330,295 385,281 440,248 495,396 550,342 605,288 660,241" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#e0f2fe">
      <circle cx="110" cy="504" r="4"/>
      <circle cx="165" cy="468" r="4"/>
      <circle cx="220" cy="414" r="4"/>
      <circle cx="275" cy="352" r="4"/>
      <circle cx="330" cy="295" r="4"/>
      <circle cx="550" cy="342" r="4"/>
      <circle cx="605" cy="288" r="4"/>
      <circle cx="660" cy="241" r="4"/>
    </g>
    <circle cx="385" cy="281" r="6" fill="#fbbf24"/>
    <circle cx="440" cy="248" r="6" fill="#f87171"/>
    <circle cx="495" cy="396" r="6" fill="#38bdf8"/>
    <text x="385" y="266" fill="#fbbf24" font-size="13" text-anchor="middle" font-weight="600">one-time nudge</text>
    <text x="440" y="233" fill="#f87171" font-size="13" text-anchor="middle" font-weight="600">compaction fires</text>
    <text x="495" y="422" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="600">lands at target</text>
  </g>

  <g filter="url(#pc-shadow)">
    <rect x="700" y="150" width="428" height="410" rx="18" fill="#0f1b2d" stroke="#1e293b" stroke-width="1.5"/>
  </g>
  <g font-family="Inter, sans-serif">
    <text x="724" y="192" fill="#e0f2fe" font-size="20" font-weight="700">What one compaction replaces</text>
    <rect x="724" y="220" width="88" height="44" rx="8" fill="#14304f" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="812" y="220" width="140" height="44" rx="8" fill="#2a1218" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="952" y="220" width="152" height="44" rx="8" fill="#0f2a1e" stroke="#4ade80" stroke-width="1.5"/>
    <g fill="#94a3b8" font-size="12.5">
      <text x="768" y="284" text-anchor="middle">protected head</text>
      <text x="882" y="284" text-anchor="middle">evicted prefix</text>
      <text x="1028" y="284" text-anchor="middle">kept tail</text>
    </g>
    <line x1="882" y1="296" x2="882" y2="330" stroke="#7dd3fc" stroke-width="2" marker-end="url(#pc-arrow)"/>
    <rect x="760" y="338" width="244" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="882" y="363" fill="#e0f2fe" font-size="14" text-anchor="middle">dense handoff summary</text>
    <g fill="#94a3b8" font-size="13">
      <text x="724" y="414">Oversized tool results in the tail become short</text>
      <text x="724" y="434">relocation markers — no summarizer call.</text>
    </g>
    <g fill="#64748b" font-size="13">
      <text x="724" y="474">The task statement and prior summaries are never evicted.</text>
      <text x="724" y="496">Tool calls never split from their results.</text>
      <text x="724" y="518">Eviction frees at least 15% of the budget — or nothing.</text>
    </g>
  </g>
</svg>