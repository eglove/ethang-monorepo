---
# MegaLinter Configuration
# Documentation: https://megalinter.io/latest/configuration/

# Disable redundant linters
DISABLE:
  - JAVASCRIPT
  - TYPESCRIPT

DISABLE_LINTERS:
  - CSS_STYLELINT
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  - SPELL_LYCHEE
  - SPELL_CSPELL
  - REPOSITORY_GRYPE
  - REPOSITORY_DEVSKIM
  - REPOSITORY_TRIVY
  - REPOSITORY_GITLEAKS
  - REPOSITORY_DUSTILOCK
  - SQL_TSQLLINT
  - COPYPASTE_JSCPD
  - JSON_JSONLINT
  # TSX linting is covered by the dedicated `lint` job; MegaLinter's TSX ESLint
  # fails because the container lacks `jiti` for TypeScript config loading.
  - TSX_ESLINT
  # zizmor needs GITHUB_TOKEN with repo scope to audit action versions;
  # the PR token lacks that scope and hard-fails with 401.
  - ACTION_ZIZMOR
  # osv-scanner reports pre-existing lockfile vulnerabilities that are not
  # introduced by individual PRs; dependency updates are managed separately.
  - REPOSITORY_OSV_SCANNER

# Configuration
PARALLEL: true
SHOW_ELAPSED_TIME: true
VALIDATE_ALL_CODEBASE: true # Validate all sources
IGNORE_GITIGNORED_FILES: true

FILTER_REGEX_EXCLUDE: (pnpm-lock\.yaml|.*\.d\.ts|.*\.idea.*|.*/migrations/meta/_journal.json|.*\.agents/.*|skills-lock\.json)

REPOSITORY_KINGFISHER_ARGUMENTS: "--exclude **/.agents/**"

CHECKOV_ARGUMENTS: "--skip-check CKV_SECRET_6"
